<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PocketMC : Telemetry Dashboard</title>
  <meta name="description"
    content="Live anonymous telemetry for PocketMC: installations, active clients, and server analytics." />

  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#000000" id="meta-theme-color" />

  <!-- Immediate URL clean-up & GitHub Pages SPA redirect restore -->
  <script>
    (function () {
      // 1. Strip index.html from URL path immediately
      if (window.location.pathname.endsWith('/index.html')) {
        var cleanPath = window.location.pathname.replace(/\/index\.html$/, '') || '/';
        window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }

      // 2. Handle GitHub Pages SPA redirection (if loaded from 404.html redirect)
      var search = window.location.search;
      if (search.startsWith('?/')) {
        var cleanRoute = search.slice(2).split('&')[0];
        var remainingQuery = search.indexOf('&') !== -1 ? '?' + search.slice(search.indexOf('&') + 1) : '';
        var targetUrl = window.location.pathname.replace(/\/$/, '') + '/' + cleanRoute + remainingQuery + window.location.hash;
        window.history.replaceState(null, '', targetUrl);
      }
    })();
  </script>

  <!-- Pre-render theme initialization to prevent Flash of Unstyled Theme (FOUT) -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('pmc-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var themeHex = theme === 'dark' ? '#000000' : '#f4f6fa';
        document.documentElement.style.backgroundColor = themeHex;
        if (document.body) document.body.style.backgroundColor = themeHex;
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', themeHex);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- PWA & WebAPK Manifest & Mobile App Meta -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PocketMC" />
  <meta name="application-name" content="PocketMC Telemetry" />

  <!-- Touch and Standard App Icons -->
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

  <!-- jsVectorMap styles and deferred maps (non-blocking for instant initial paint) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.css"
    integrity="sha384-DkPMVIJ2hERal/WJDrT3mRGo8KOwiHVdjiyRxCFlUnMdvu52V0Y1CL1yULYSDn4h" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.js"
    integrity="sha384-5T42pwmm9Eq6IKYKkuugmsyxvzvXDazwImzsC76X6lihpgExlMJYSrAtpb5JGZsW" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/maps/world.js"
    integrity="sha384-sGlkSOVF9H+QNNQrLV9xrMIyghEgioD3M3gPd9/tV0mh9qJX75AyCl0l7+OVJ3CD" crossorigin="anonymous"></script>
</head>

<body style="margin: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
